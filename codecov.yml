# CodeCov configuration for ezsnmp
# Documentation: https://docs.codecov.com/docs/codecov-yaml

# Coverage configuration
coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
    patch:
      default:
        target: auto
        threshold: 1%
        informational: false

# Ignore paths - exclude test files from coverage reports
ignore:
  - "python_tests/**"
  - "cpp_tests/**"
  - "integration_tests/**"
  - "cml_tests/**"
  - "tests/**"
  - "test_*.py"
  - "test_*.cpp"
  - "**/test_*.py"
  - "**/test_*.cpp"
  - "**/*_test.py"
  - "**/*_test.cpp"
  - "conftest.py"
  - "setup.py"
  - "setup.cfg"

# Flag management: exactly ONE flag per upload (language + environment).
# Carryforward replaces a carried-forward session whenever ANY of its flags is
# uploaded again. With shared flags (e.g. `cpp,native` + `python,native`), a commit
# that only ran Python tests wiped the C++ coverage. Unique flags keep each
# workflow's coverage carried forward independently when its tests are skipped.
# Use the components below for per-language (Python / C++) views.
flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: python-native
      paths:
        - ezsnmp/*.py
        - ezsnmp/**/*.py
    - name: python-docker
      paths:
        - ezsnmp/*.py
        - ezsnmp/**/*.py
    - name: cpp-native
      paths:
        - ezsnmp/**/*.cpp
        - ezsnmp/**/*.h
    - name: cpp-docker
      paths:
        - ezsnmp/**/*.cpp
        - ezsnmp/**/*.h

# Comment configuration for pull requests
comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true

# Component configuration to track Python and C++ separately
component_management:
  individual_components:
    - component_id: python_code
      name: "Python Code"
      paths:
        - ezsnmp/*.py
        - ezsnmp/**/*.py
    - component_id: cpp_code
      name: "C++ Code"
      paths:
        - ezsnmp/**/*.cpp
        - ezsnmp/**/*.h
