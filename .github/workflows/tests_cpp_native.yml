# This workflow builds and runs the C++ tests using Meson and Ninja
# on multiple operating systems.
# It checks for changes in the C++ source code and runs tests only if there are changes.
name: C++ Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

# Added explicit permissions so the publish-unit-test-result action can create check runs
permissions:
  contents: write
  checks: write

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in C++ source or test files
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
        with:
          files: |
            .github/workflows/tests_cpp_native.yml
            cpp_tests/**
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            tools/prepare_netsnmp_source.py

  build-and-test:
    name: Build and Run C++ Tests on ${{ matrix.os }}
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Cache Net-SNMP 5.10 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/netsnmp-5.10
            /tmp/netsnmp-5.10-linux
          key: netsnmp-5.10-cpp-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('tools/prepare_linux_netsnmp.sh', 'tools/prepare_macos_netsnmp.sh', 'tools/prepare_netsnmp_source.py') }}

      - name: Cache C++ build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp_tests/build
          key: cpp-native-build-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('ezsnmp/**/*.cpp', 'ezsnmp/**/*.h', 'cpp_tests/**', 'tools/prepare_linux_netsnmp.sh', 'tools/prepare_macos_netsnmp.sh') }}
          restore-keys: |
            cpp-native-build-${{ matrix.os }}-${{ runner.arch }}-

      - name: Install Net-SNMP and build dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            sudo apt-get update
            sudo apt-get install -y build-essential meson ninja-build cmake pkg-config \
              libsnmp-dev libperl-dev libssl-dev libgtest-dev lcov gcovr snmpd
            sudo systemctl stop snmpd || true
          macos: |
            HOMEBREW_NO_AUTO_UPDATE=1 brew install net-snmp openssl@3 meson ninja cmake googletest lcov

      - name: Run pre-build command
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get install -y snmp-mibs-downloader
            sudo download-mibs
            sudo apt-get purge -y libsnmp-dev
            if [ -x /tmp/netsnmp-5.10-linux/bin/net-snmp-config ] && [ -f /tmp/netsnmp-5.10-linux/lib/pkgconfig/netsnmp.pc ]; then
              echo "Restoring cached Net-SNMP 5.10 to /usr/local..."
              sudo cp -a /tmp/netsnmp-5.10-linux/. /usr/local/
              sudo ldconfig /usr/local/lib || true
            fi
            sudo bash ./tools/prepare_linux_netsnmp.sh
            if [ ! -x /tmp/netsnmp-5.10-linux/bin/net-snmp-config ] && [ -x /usr/local/bin/net-snmp-config ]; then
              mkdir -p /tmp/netsnmp-5.10-linux/bin /tmp/netsnmp-5.10-linux/include /tmp/netsnmp-5.10-linux/lib/pkgconfig /tmp/netsnmp-5.10-linux/share
              cp -a /usr/local/bin/net-snmp-config /tmp/netsnmp-5.10-linux/bin/
              cp -a /usr/local/include/net-snmp /tmp/netsnmp-5.10-linux/include/
              cp -a /usr/local/lib/libnetsnmp* /tmp/netsnmp-5.10-linux/lib/
              cp -a /usr/local/lib/pkgconfig/netsnmp.pc /tmp/netsnmp-5.10-linux/lib/pkgconfig/
              if [ -d /usr/local/share/snmp ]; then
                cp -a /usr/local/share/snmp /tmp/netsnmp-5.10-linux/share/
              fi
            fi
            echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
            echo "LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
            echo "/usr/local/bin" >> "$GITHUB_PATH"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            PREFIX="/tmp/netsnmp-5.10" bash ./tools/prepare_macos_netsnmp.sh
            cp -f "/tmp/netsnmp-5.10/lib/pkgconfig/netsnmp.pc" "$(brew --prefix net-snmp)/lib/pkgconfig/netsnmp.pc"
            echo "PKG_CONFIG_PATH=/tmp/netsnmp-5.10/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
            echo "/tmp/netsnmp-5.10/bin" >> "$GITHUB_PATH"
          fi
          mkdir -p -m 0755 ~/.snmp
          echo 'mibs +ALL' > ~/.snmp/snmp.conf

      - name: Start SNMP daemon
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PATH="$(brew --prefix net-snmp)/bin:$(brew --prefix net-snmp)/sbin:$PATH"
          fi
          SNMPD=$(command -v snmpd)
          "$SNMPD" -C -c configs/snmpd.conf -r -Le -m ALL
          for attempt in $(seq 1 15); do
            if snmpget -v2c -c public -t 1 -r 0 udp:127.0.0.1:11161 .1.3.6.1.2.1.1.1.0 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "SNMP daemon did not become ready on 127.0.0.1:11161" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Configure, build, and run C++ tests
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "macOS" ]; then
            export PKG_CONFIG_PATH="/tmp/netsnmp-5.10/lib/pkgconfig:$(brew --prefix net-snmp)/lib/pkgconfig:$(brew --prefix openssl@3)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
            export PATH="/tmp/netsnmp-5.10/bin:$(brew --prefix net-snmp)/bin:$(brew --prefix net-snmp)/sbin:$PATH"
          fi
          COVERAGE_OPT=""
          if [ "$RUNNER_OS" = "Linux" ]; then
            COVERAGE_OPT="-Db_coverage=true"
          fi
          if [ -f "cpp_tests/build/build.ninja" ]; then
            meson compile -C cpp_tests/build || (rm -rf cpp_tests/build && meson setup cpp_tests/build cpp_tests $COVERAGE_OPT && meson compile -C cpp_tests/build)
          else
            rm -rf cpp_tests/build
            meson setup cpp_tests/build cpp_tests $COVERAGE_OPT
            meson compile -C cpp_tests/build
          fi
          meson test -C cpp_tests/build --print-errorlogs

      - name: Upload C++ coverage to Codecov
        if: always() && runner.os == 'Linux'
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cpp_tests/build/meson-logs/coverage.xml,./coverage.xml
          flags: cpp-native
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload C++ test results to Codecov
        if: always()
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5.4.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cpp_tests/build/meson-logs/testlog.junit.xml
          flags: cpp-native
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload C++ test results artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: cpp-test-results-${{ matrix.os }}
          path: ./cpp_tests/build/meson-logs/testlog.junit.xml
          if-no-files-found: ignore

  comment-cpp-test-report:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      pull-requests: write # Needed to create/update PR comments
      contents: write      # Needed to read artifacts/content for check run
      checks: write        # Needed to create/update check runs
    if: always() && github.event_name == 'pull_request' && needs.build-and-test.result != 'skipped'
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-test-results-*
          path: test-results
          merge-multiple: false

      - name: Publish C++ Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: test-results/**/*.xml
          check_name: C++ Test Results - Native
          comment_title: C++ Test Results - Native
