# This workflow builds and runs the C++ tests using Meson and Ninja
# on multiple operating systems.
# It checks for changes in the C++ source code and runs tests only if there are changes.
name: C++ Tests
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

# Added explicit permissions so the publish-unit-test-result action can create check runs
permissions:
  contents: write
  checks: write

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in C++ source or test files
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@873e1fea29bbd9dc73651d85a28920cb0797cb85
        with:
          files: |
            .github/workflows/tests_cpp_native.yml
            cpp_tests/**
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h

  build-and-test:
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true'
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_tests_cpp_native.yml@873e1fea29bbd9dc73651d85a28920cb0797cb85
    with:
      build-system: meson
      source-dir: cpp_tests
      build-dir: cpp_tests/build
      install-netsnmp: true
      start-snmpd: true
      pre-build-cmd: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          sudo apt-get install -y snmp-mibs-downloader
          sudo download-mibs
        fi
        mkdir -p -m 0755 ~/.snmp
        echo 'mibs +ALL' > ~/.snmp/snmp.conf
      codecov-flags: cpp-native
      coverage-files: ./cpp_tests/build/meson-logs/coverage.xml,./coverage.xml
      junit-files: ./cpp_tests/build/meson-logs/testlog.junit.xml
    secrets:
      codecov-token: ${{ secrets.CODECOV_TOKEN }}

  comment-cpp-test-report:
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      pull-requests: write # Needed to create/update PR comments
      contents: write      # Needed to read artifacts/content for check run
      checks: write        # Needed to create/update check runs
    if: always() && github.event_name == 'pull_request' && needs.build-and-test.result != 'skipped'
    steps:
      - name: Download All Test Results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cpp-test-results-*
          path: test-results
          merge-multiple: true

      - name: Publish C++ Test Results
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: test-results/**/*.xml
          check_name: C++ Test Results - Native
          comment_title: C++ Test Results - Native
