name: Run Dockerized Python Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .coveragerc
            .github/scripts/**
            .github/workflows/tests_docker_python_tests.yml
            codecov.yml
            docker/**
            ezsnmp/*.py
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h
            ezsnmp/**/*.py
            python_tests/**
            setup.cfg
            setup.py

  test-python-tests:
    needs: check-changes
    if: needs.check-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - almalinux10_netsnmp_5.9
          - archlinux_netsnmp_5.7
          - archlinux_netsnmp_5.8
          - archlinux_netsnmp_5.9
          - centos7_netsnmp_5.7
          - centos8_netsnmp_5.8
          - fedora42_netsnmp_5.7
          - fedora42_netsnmp_5.8
          - fedora42_netsnmp_5.9
          - rockylinux8_netsnmp_5.8
          - rockylinux9_netsnmp_5.9
        python: [py310, py311, py312, py313, py314]
        test_group: [session_basic, session_walk, snmp_ops, core_misc]
        include:
          - test_group: session_basic
            test_files: "python_tests/test_session_unit.py python_tests/test_session_get.py python_tests/test_session_set.py python_tests/test_session_parameters.py python_tests/test_session_exception_branches.py"
          - test_group: session_walk
            test_files: "python_tests/test_session_walk.py python_tests/test_session_bulk_get.py python_tests/test_multithreading_session_options.py"
          - test_group: snmp_ops
            test_files: "python_tests/test_snmpbulkget.py python_tests/test_snmpbulkwalk.py python_tests/test_snmpget.py python_tests/test_snmpgetnext.py python_tests/test_snmpset.py python_tests/test_snmptrap.py python_tests/test_snmpwalk.py python_tests/test_multithreading_v3.py"
          - test_group: core_misc
            test_files: "python_tests/test_netsnmp_unit.py python_tests/test_exceptions.py python_tests/test_getters.py python_tests/test_helpers.py python_tests/test_datatypes.py python_tests/test_logging.py python_tests/test_auth_priv_v3.py python_tests/test_cache_v3.py python_tests/test_normalize_coverage_paths.py python_tests/test_setup_macos.py python_tests/test_setup_windows.py"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Compute Docker image cache key
        id: cache-key
        run: |
          WEEK_KEY=$(date -u +"%Y-%V")
          echo "week=$WEEK_KEY" >> $GITHUB_OUTPUT

      - name: Restore cached Docker image tar
        id: cache-restore
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .docker-image-cache/${{ matrix.distribution }}.tar
          key: docker-image-${{ matrix.distribution }}-${{ steps.cache-key.outputs.week }}-v1
          restore-keys: |
            docker-image-${{ matrix.distribution }}-

      - name: Load Docker image from cache (if present)
        run: |
          set -euo pipefail
          TAR_PATH=".docker-image-cache/${{ matrix.distribution }}.tar"
          if [ -f "$TAR_PATH" ]; then
            echo "Loading cached image from $TAR_PATH"
            if ! docker load -i "$TAR_PATH"; then
              echo "WARNING: docker load failed (corrupt/stale tar). Removing and falling through to pull."
              rm -f "$TAR_PATH"
            fi
          else
            echo "No cached image tar found. Will pull from registry."
          fi

      - name: Pull Docker image (with registry fallback)
        run: |
          set -euo pipefail
          DHUB_IMAGE="carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          GHCR_IMAGE="ghcr.io/carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          if docker pull "$DHUB_IMAGE"; then
            echo "Pulled from Docker Hub: $DHUB_IMAGE"
          elif docker pull "$GHCR_IMAGE"; then
            echo "Docker Hub unavailable; pulled from GHCR: $GHCR_IMAGE"
            docker tag "$GHCR_IMAGE" "$DHUB_IMAGE"
          else
            echo "ERROR: Failed to pull image from both Docker Hub and GHCR." >&2
            exit 1
          fi

      - name: Save Docker image to cache tar
        if: always()
        run: |
          set -euo pipefail
          mkdir -p .docker-image-cache
          IMAGE="carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          TAR_PATH=".docker-image-cache/${{ matrix.distribution }}.tar"
          # Save or refresh the tar to ensure cache captures it
          docker save "$IMAGE" -o "$TAR_PATH"

      - name: Set up pip cache directory
        run: |
          mkdir -p ${{ runner.temp }}/pip-cache-${{ matrix.python }}
          chmod 777 ${{ runner.temp }}/pip-cache-${{ matrix.python }}

      - name: Cache pip packages for tox (Docker)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pip-cache-${{ matrix.python }}
          key: pip-docker-${{ matrix.python }}-${{ hashFiles('python_tests/requirements.txt') }}
          restore-keys: |
            pip-docker-${{ matrix.python }}-

      - name: Start container and SNMP daemon
        run: |
          set -euo pipefail
          IMAGE="carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          CONTAINER_NAME="${{ matrix.distribution }}_test_container"
          ENTRY_SCRIPT="/usr/local/bin/DockerEntry.sh"
          HOST_SOURCE_PATH="$PWD"
          CONTAINER_WORK_DIR="/ezsnmp"
          echo ">>> Starting container: $CONTAINER_NAME"
          echo "    - Using host source path: $HOST_SOURCE_PATH"
          echo "    - Mounting to: $CONTAINER_WORK_DIR"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          if ! docker run -d \
            --name "$CONTAINER_NAME" \
            -v "$HOST_SOURCE_PATH:$CONTAINER_WORK_DIR" \
            "$IMAGE" \
            /bin/bash -c "$ENTRY_SCRIPT false & tail -f /dev/null"; then
              echo "ERROR: Docker run failed for $IMAGE" >&2
              exit 1
          fi

      - name: Run pytest for ${{ matrix.python }} - ${{ matrix.test_group }}
        run: |
          set -euo pipefail
          CONTAINER_NAME="${{ matrix.distribution }}_test_container"
          # Build absolute paths on the runner to avoid complex quoting inside docker exec
          TEST_FILES_ABS=$(echo "${{ matrix.test_files }}" | tr ' ' '\n' | sed 's|^|/ezsnmp/|' | tr '\n' ' ')
          echo ">>> Executing pytest (${{ matrix.test_group }}) inside container: $CONTAINER_NAME"
          docker exec -t -e TEST_FILES_ABS="$TEST_FILES_ABS" "$CONTAINER_NAME" bash -c '
            set -e
            export PATH=/usr/local/bin:/opt/rh/gcc-toolset-11/root/usr/bin:/opt/rh/devtoolset-11/root/usr/bin:$PATH;
            export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:${LD_LIBRARY_PATH:-};
            PY_KEY="${{ matrix.python }}";
            PY_VER="${PY_KEY#py}";
            PYTHON_BIN="python${PY_VER:0:1}.${PY_VER:1}";
            VENV_DIR="/tmp/venv_${{ matrix.python }}";
            echo "    - Creating venv with $PYTHON_BIN at $VENV_DIR";
            "$PYTHON_BIN" -m venv "$VENV_DIR";
            echo "    - Installing test dependencies";
            "$VENV_DIR/bin/pip" install --quiet -r /ezsnmp/python_tests/requirements.txt;
            echo "    - Installing ezsnmp";
            cd /ezsnmp && "$VENV_DIR/bin/pip" install --quiet . && mv /ezsnmp/ezsnmp /ezsnmp/_ezsnmp;
            echo "    - Running pytest (${{ matrix.test_group }}): $TEST_FILES_ABS";
            if "$VENV_DIR/bin/pytest" -v -s --timeout=300 \
              -o junit_family=legacy \
              --junitxml=/ezsnmp/test-results.xml \
              --cov=ezsnmp --cov-report=term-missing \
              --cov-report=xml:/ezsnmp/coverage.xml \
              --cov-config=/ezsnmp/.coveragerc \
              $TEST_FILES_ABS > /ezsnmp/test-outputs.txt 2>&1; then
              echo "    - Pytest completed for $PY_KEY (${{ matrix.test_group }})";
            else
              echo "    - Pytest reported failures for $PY_KEY (${{ matrix.test_group }}) (continuing to collect artifacts)";
            fi;
            mv /ezsnmp/_ezsnmp /ezsnmp/ezsnmp 2>/dev/null || true;
            exit 0;
          '

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docker
          if [ -f test-results.xml ]; then \
            mv test-results.xml docker/test-results_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${{ matrix.test_group }}.xml; \
          else \
            echo "<testsuite></testsuite>" > docker/test-results_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${{ matrix.test_group }}.xml; \
          fi
          mv test-outputs.txt docker/test-outputs_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${{ matrix.test_group }}.txt
          if [ -f coverage.xml ]; then \
            mv coverage.xml docker/coverage_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${{ matrix.test_group }}.xml; \
          fi

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f "${{ matrix.distribution }}_test_container" >/dev/null 2>&1 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: pytest-results_${{ matrix.distribution }}_${{ matrix.python }}_${{ matrix.test_group }}
          path: |
            docker/test-results_${{ matrix.distribution }}*.xml
            docker/test-outputs_${{ matrix.distribution }}*.txt
            docker/coverage_${{ matrix.distribution }}*.xml

  upload-python-coverage-dockerized:
    runs-on: ubuntu-latest
    needs: [check-changes, test-python-tests]
    permissions:
      contents: read
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-python-tests.result != 'skipped'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pytest-results_*
          merge-multiple: true

      - name: Check if coverage files exist
        id: check-coverage
        run: |
          if compgen -G "./docker/coverage_*.xml" > /dev/null || compgen -G "./coverage_*.xml" > /dev/null; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Normalize coverage paths
        if: steps.check-coverage.outputs.has_coverage == 'true'
        run: |
          python3 python_tests/normalize_coverage_paths.py ./docker/coverage_*.xml ./coverage_*.xml

      - name: Upload coverage to CodeCov
        if: steps.check-coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./docker/coverage_*.xml,./coverage_*.xml
          flags: python,docker
          fail_ci_if_error: false
          verbose: true

      - name: Check if test results exist
        id: check-results
        run: |
          if compgen -G "./docker/test-results_*.xml" > /dev/null || compgen -G "./test-results_*.xml" > /dev/null; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results to Codecov
        if: steps.check-results.outputs.has_results == 'true'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./docker/test-results_*.xml,./test-results_*.xml
          flags: python,docker
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  comment-pytest-coverage-report:
    runs-on: ubuntu-latest
    needs: [check-changes, test-python-tests]
    permissions:
      contents: write # This is needed to create/update commit comments
      pull-requests: write # This is needed to create/update comments
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-python-tests.result != 'skipped'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pytest-results_*
          merge-multiple: true

      - name: Prepare test output files
        run: |
          if [ -d "docker" ]; then
            cp -n docker/* . 2>/dev/null || true
          fi
          ls -Rlah

      - name: Check if test outputs exist
        id: check-outputs
        run: |
          if compgen -G "test-outputs_*.txt" > /dev/null || compgen -G "./docker/test-outputs_*.txt" > /dev/null; then
            echo "has_outputs=true" >> $GITHUB_OUTPUT
          else
            echo "has_outputs=false" >> $GITHUB_OUTPUT
          fi

      - name: Pytest coverage comment (Dockerized Tests)
        id: pytest-coverage
        if: steps.check-outputs.outputs.has_outputs == 'true'
        uses: MishaKav/pytest-coverage-comment@432ac90e8d345c93e1d90ee0838b35913abc9c9b # v1.12.2
        continue-on-error: true
        with:
          pytest-coverage-path: ""
          title: Pytest Coverage Report - Dockerized Tests
          unique-id-for-comment: dockerized-python-tests
          hide-badge: true
          hide-report: true
          create-new-comment: false
          hide-comment: true
          report-only-changed-files: false
          multiple-files: |
            almalinux10_netsnmp_5.9_py310_session_basic, test-outputs_almalinux10_netsnmp_5.9_test_container_py310_session_basic.txt, test-results_almalinux10_netsnmp_5.9_test_container_py310_session_basic.xml
            almalinux10_netsnmp_5.9_py310_session_walk, test-outputs_almalinux10_netsnmp_5.9_test_container_py310_session_walk.txt, test-results_almalinux10_netsnmp_5.9_test_container_py310_session_walk.xml
            almalinux10_netsnmp_5.9_py310_snmp_ops, test-outputs_almalinux10_netsnmp_5.9_test_container_py310_snmp_ops.txt, test-results_almalinux10_netsnmp_5.9_test_container_py310_snmp_ops.xml
            almalinux10_netsnmp_5.9_py310_core_misc, test-outputs_almalinux10_netsnmp_5.9_test_container_py310_core_misc.txt, test-results_almalinux10_netsnmp_5.9_test_container_py310_core_misc.xml
            almalinux10_netsnmp_5.9_py311_session_basic, test-outputs_almalinux10_netsnmp_5.9_test_container_py311_session_basic.txt, test-results_almalinux10_netsnmp_5.9_test_container_py311_session_basic.xml
            almalinux10_netsnmp_5.9_py311_session_walk, test-outputs_almalinux10_netsnmp_5.9_test_container_py311_session_walk.txt, test-results_almalinux10_netsnmp_5.9_test_container_py311_session_walk.xml
            almalinux10_netsnmp_5.9_py311_snmp_ops, test-outputs_almalinux10_netsnmp_5.9_test_container_py311_snmp_ops.txt, test-results_almalinux10_netsnmp_5.9_test_container_py311_snmp_ops.xml
            almalinux10_netsnmp_5.9_py311_core_misc, test-outputs_almalinux10_netsnmp_5.9_test_container_py311_core_misc.txt, test-results_almalinux10_netsnmp_5.9_test_container_py311_core_misc.xml
            almalinux10_netsnmp_5.9_py312_session_basic, test-outputs_almalinux10_netsnmp_5.9_test_container_py312_session_basic.txt, test-results_almalinux10_netsnmp_5.9_test_container_py312_session_basic.xml
            almalinux10_netsnmp_5.9_py312_session_walk, test-outputs_almalinux10_netsnmp_5.9_test_container_py312_session_walk.txt, test-results_almalinux10_netsnmp_5.9_test_container_py312_session_walk.xml
            almalinux10_netsnmp_5.9_py312_snmp_ops, test-outputs_almalinux10_netsnmp_5.9_test_container_py312_snmp_ops.txt, test-results_almalinux10_netsnmp_5.9_test_container_py312_snmp_ops.xml
            almalinux10_netsnmp_5.9_py312_core_misc, test-outputs_almalinux10_netsnmp_5.9_test_container_py312_core_misc.txt, test-results_almalinux10_netsnmp_5.9_test_container_py312_core_misc.xml
            almalinux10_netsnmp_5.9_py313_session_basic, test-outputs_almalinux10_netsnmp_5.9_test_container_py313_session_basic.txt, test-results_almalinux10_netsnmp_5.9_test_container_py313_session_basic.xml
            almalinux10_netsnmp_5.9_py313_session_walk, test-outputs_almalinux10_netsnmp_5.9_test_container_py313_session_walk.txt, test-results_almalinux10_netsnmp_5.9_test_container_py313_session_walk.xml
            almalinux10_netsnmp_5.9_py313_snmp_ops, test-outputs_almalinux10_netsnmp_5.9_test_container_py313_snmp_ops.txt, test-results_almalinux10_netsnmp_5.9_test_container_py313_snmp_ops.xml
            almalinux10_netsnmp_5.9_py313_core_misc, test-outputs_almalinux10_netsnmp_5.9_test_container_py313_core_misc.txt, test-results_almalinux10_netsnmp_5.9_test_container_py313_core_misc.xml
            almalinux10_netsnmp_5.9_py314_session_basic, test-outputs_almalinux10_netsnmp_5.9_test_container_py314_session_basic.txt, test-results_almalinux10_netsnmp_5.9_test_container_py314_session_basic.xml
            almalinux10_netsnmp_5.9_py314_session_walk, test-outputs_almalinux10_netsnmp_5.9_test_container_py314_session_walk.txt, test-results_almalinux10_netsnmp_5.9_test_container_py314_session_walk.xml
            almalinux10_netsnmp_5.9_py314_snmp_ops, test-outputs_almalinux10_netsnmp_5.9_test_container_py314_snmp_ops.txt, test-results_almalinux10_netsnmp_5.9_test_container_py314_snmp_ops.xml
            almalinux10_netsnmp_5.9_py314_core_misc, test-outputs_almalinux10_netsnmp_5.9_test_container_py314_core_misc.txt, test-results_almalinux10_netsnmp_5.9_test_container_py314_core_misc.xml
            archlinux_netsnmp_5.7_py310_session_basic, test-outputs_archlinux_netsnmp_5.7_test_container_py310_session_basic.txt, test-results_archlinux_netsnmp_5.7_test_container_py310_session_basic.xml
            archlinux_netsnmp_5.7_py310_session_walk, test-outputs_archlinux_netsnmp_5.7_test_container_py310_session_walk.txt, test-results_archlinux_netsnmp_5.7_test_container_py310_session_walk.xml
            archlinux_netsnmp_5.7_py310_snmp_ops, test-outputs_archlinux_netsnmp_5.7_test_container_py310_snmp_ops.txt, test-results_archlinux_netsnmp_5.7_test_container_py310_snmp_ops.xml
            archlinux_netsnmp_5.7_py310_core_misc, test-outputs_archlinux_netsnmp_5.7_test_container_py310_core_misc.txt, test-results_archlinux_netsnmp_5.7_test_container_py310_core_misc.xml
            archlinux_netsnmp_5.7_py311_session_basic, test-outputs_archlinux_netsnmp_5.7_test_container_py311_session_basic.txt, test-results_archlinux_netsnmp_5.7_test_container_py311_session_basic.xml
            archlinux_netsnmp_5.7_py311_session_walk, test-outputs_archlinux_netsnmp_5.7_test_container_py311_session_walk.txt, test-results_archlinux_netsnmp_5.7_test_container_py311_session_walk.xml
            archlinux_netsnmp_5.7_py311_snmp_ops, test-outputs_archlinux_netsnmp_5.7_test_container_py311_snmp_ops.txt, test-results_archlinux_netsnmp_5.7_test_container_py311_snmp_ops.xml
            archlinux_netsnmp_5.7_py311_core_misc, test-outputs_archlinux_netsnmp_5.7_test_container_py311_core_misc.txt, test-results_archlinux_netsnmp_5.7_test_container_py311_core_misc.xml
            archlinux_netsnmp_5.7_py312_session_basic, test-outputs_archlinux_netsnmp_5.7_test_container_py312_session_basic.txt, test-results_archlinux_netsnmp_5.7_test_container_py312_session_basic.xml
            archlinux_netsnmp_5.7_py312_session_walk, test-outputs_archlinux_netsnmp_5.7_test_container_py312_session_walk.txt, test-results_archlinux_netsnmp_5.7_test_container_py312_session_walk.xml
            archlinux_netsnmp_5.7_py312_snmp_ops, test-outputs_archlinux_netsnmp_5.7_test_container_py312_snmp_ops.txt, test-results_archlinux_netsnmp_5.7_test_container_py312_snmp_ops.xml
            archlinux_netsnmp_5.7_py312_core_misc, test-outputs_archlinux_netsnmp_5.7_test_container_py312_core_misc.txt, test-results_archlinux_netsnmp_5.7_test_container_py312_core_misc.xml
            archlinux_netsnmp_5.7_py313_session_basic, test-outputs_archlinux_netsnmp_5.7_test_container_py313_session_basic.txt, test-results_archlinux_netsnmp_5.7_test_container_py313_session_basic.xml
            archlinux_netsnmp_5.7_py313_session_walk, test-outputs_archlinux_netsnmp_5.7_test_container_py313_session_walk.txt, test-results_archlinux_netsnmp_5.7_test_container_py313_session_walk.xml
            archlinux_netsnmp_5.7_py313_snmp_ops, test-outputs_archlinux_netsnmp_5.7_test_container_py313_snmp_ops.txt, test-results_archlinux_netsnmp_5.7_test_container_py313_snmp_ops.xml
            archlinux_netsnmp_5.7_py313_core_misc, test-outputs_archlinux_netsnmp_5.7_test_container_py313_core_misc.txt, test-results_archlinux_netsnmp_5.7_test_container_py313_core_misc.xml
            archlinux_netsnmp_5.7_py314_session_basic, test-outputs_archlinux_netsnmp_5.7_test_container_py314_session_basic.txt, test-results_archlinux_netsnmp_5.7_test_container_py314_session_basic.xml
            archlinux_netsnmp_5.7_py314_session_walk, test-outputs_archlinux_netsnmp_5.7_test_container_py314_session_walk.txt, test-results_archlinux_netsnmp_5.7_test_container_py314_session_walk.xml
