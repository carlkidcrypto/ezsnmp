name: Run Dockerized Python Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .coveragerc
            .github/workflows/tests_docker_python_tests.yml
            codecov.yml
            docker/**
            ezsnmp/*.py
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h
            ezsnmp/**/*.py
            python_tests/**
            setup.cfg
            setup.py

  test-python-tests:
    needs: check-changes
    if: needs.check-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        distribution:
          - almalinux10_netsnmp_5.10
          - archlinux_netsnmp_5.10
          - fedora42_netsnmp_5.10
          - rockylinux9_netsnmp_5.10
        python: [py310, py311, py312, py313, py314]
        test_group: [all]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Pull Docker image (with registry fallback)
        run: |
          set -euo pipefail
          DHUB_IMAGE="carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          GHCR_IMAGE="ghcr.io/carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          if docker pull "$DHUB_IMAGE"; then
            echo "Pulled from Docker Hub: $DHUB_IMAGE"
          elif docker pull "$GHCR_IMAGE"; then
            echo "Docker Hub unavailable; pulled from GHCR: $GHCR_IMAGE"
            docker tag "$GHCR_IMAGE" "$DHUB_IMAGE"
          else
            echo "ERROR: Failed to pull image from both Docker Hub and GHCR." >&2
            exit 1
          fi

      - name: Start container and SNMP daemon
        run: |
          set -euo pipefail
          IMAGE="carlkidcrypto/ezsnmp_test_images:${{ matrix.distribution }}-latest"
          CONTAINER_NAME="${{ matrix.distribution }}_test_container"
          ENTRY_SCRIPT="/usr/local/bin/DockerEntry.sh"
          HOST_SOURCE_PATH="$PWD"
          CONTAINER_WORK_DIR="/ezsnmp"
          echo ">>> Starting container: $CONTAINER_NAME"
          echo "    - Using host source path: $HOST_SOURCE_PATH"
          echo "    - Mounting to: $CONTAINER_WORK_DIR"
          docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
          if ! docker run -d \
            --name "$CONTAINER_NAME" \
            -v "$HOST_SOURCE_PATH:$CONTAINER_WORK_DIR" \
            "$IMAGE" \
            /bin/bash -c "$ENTRY_SCRIPT false & tail -f /dev/null"; then
              echo "ERROR: Docker run failed for $IMAGE" >&2
              exit 1
          fi

      - name: Run pytest for ${{ matrix.python }} - all tests
        run: |
          set -euo pipefail
          CONTAINER_NAME="${{ matrix.distribution }}_test_container"
          echo ">>> Executing all Python test groups inside container: $CONTAINER_NAME"
          docker exec -t "$CONTAINER_NAME" bash -c '
            set -e
            export PATH=/usr/local/bin:/opt/rh/gcc-toolset-11/root/usr/bin:/opt/rh/devtoolset-11/root/usr/bin:$PATH;
            export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64:${LD_LIBRARY_PATH:-};
            PY_KEY="${{ matrix.python }}";
            PY_VER="${PY_KEY#py}";
            PYTHON_BIN="python${PY_VER:0:1}.${PY_VER:1}";
            VENV_DIR="/tmp/venv_${{ matrix.python }}";
            echo "    - Creating venv with $PYTHON_BIN at $VENV_DIR";
            "$PYTHON_BIN" -m venv "$VENV_DIR";
            echo "    - Installing test dependencies";
            "$VENV_DIR/bin/pip" install --quiet -r /ezsnmp/python_tests/requirements.txt;
            echo "    - Installing ezsnmp";
            cd /ezsnmp && "$VENV_DIR/bin/pip" install --quiet . && mv /ezsnmp/ezsnmp /ezsnmp/_ezsnmp;
            PYTEST_STATUS=0;
            for TEST_GROUP in session_basic session_walk snmp_ops core_misc; do
              case "$TEST_GROUP" in
                session_basic)
                  TEST_FILES="python_tests/test_session_unit.py python_tests/test_session_get.py python_tests/test_session_set.py python_tests/test_session_parameters.py python_tests/test_session_exception_branches.py"
                  ;;
                session_walk)
                  TEST_FILES="python_tests/test_session_walk.py python_tests/test_session_bulk_get.py python_tests/test_multithreading_session_options.py"
                  ;;
                snmp_ops)
                  TEST_FILES="python_tests/test_snmpbulkget.py python_tests/test_snmpbulkwalk.py python_tests/test_snmpget.py python_tests/test_snmpgetnext.py python_tests/test_snmpset.py python_tests/test_snmptrap.py python_tests/test_snmpwalk.py python_tests/test_multithreading_v3.py"
                  ;;
                core_misc)
                  TEST_FILES="python_tests/test_netsnmp_unit.py python_tests/test_exceptions.py python_tests/test_getters.py python_tests/test_helpers.py python_tests/test_datatypes.py python_tests/test_logging.py python_tests/test_auth_priv_v3.py python_tests/test_cache_v3.py python_tests/test_normalize_coverage_paths.py python_tests/test_setup_macos.py python_tests/test_setup_parallel.py python_tests/test_setup_windows.py"
                  ;;
              esac;
              read -r -a TEST_FILES_ARRAY <<< "$TEST_FILES";
              echo "    - Running pytest group $TEST_GROUP for $PY_KEY";
              if "$VENV_DIR/bin/pytest" -v -s --timeout=300 \
                -o junit_family=legacy \
                --junitxml="/ezsnmp/test-results_${TEST_GROUP}.xml" \
                --cov=ezsnmp --cov-report=term-missing \
                --cov-report="xml:/ezsnmp/coverage_${TEST_GROUP}.xml" \
                --cov-config=/ezsnmp/.coveragerc \
                "${TEST_FILES_ARRAY[@]}" > "/ezsnmp/test-outputs_${TEST_GROUP}.txt" 2>&1; then
                echo "    - Pytest completed for $PY_KEY ($TEST_GROUP)";
              else
                echo "    - Pytest reported failures for $PY_KEY ($TEST_GROUP); continuing to collect artifacts";
                PYTEST_STATUS=1;
              fi;
            done;
            mv /ezsnmp/_ezsnmp /ezsnmp/ezsnmp 2>/dev/null || true;
            exit "$PYTEST_STATUS";
          '

      - name: Collect artifacts
        if: always()
        run: |
          set -euo pipefail
          mkdir -p docker
          for test_group in session_basic session_walk snmp_ops core_misc; do
            results="docker/test-results_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${test_group}.xml"
            outputs="docker/test-outputs_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${test_group}.txt"
            coverage="docker/coverage_${{ matrix.distribution }}_test_container_${{ matrix.python }}_${test_group}.xml"
            if [ -f "test-results_${test_group}.xml" ]; then
              mv "test-results_${test_group}.xml" "$results"
            else
              echo "<testsuite></testsuite>" > "$results"
            fi
            if [ -f "test-outputs_${test_group}.txt" ]; then
              mv "test-outputs_${test_group}.txt" "$outputs"
            else
              echo "Pytest output was not produced." > "$outputs"
            fi
            if [ -f "coverage_${test_group}.xml" ]; then
              mv "coverage_${test_group}.xml" "$coverage"
            fi
          done

      - name: Stop and remove container
        if: always()
        run: |
          docker rm -f "${{ matrix.distribution }}_test_container" >/dev/null 2>&1 || true

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: pytest-results_${{ matrix.distribution }}_${{ matrix.python }}_${{ matrix.test_group }}
          path: |
            docker/test-results_${{ matrix.distribution }}*.xml
            docker/test-outputs_${{ matrix.distribution }}*.txt
            docker/coverage_${{ matrix.distribution }}*.xml

  upload-python-coverage-dockerized:
    runs-on: ubuntu-latest
    needs: [check-changes, test-python-tests]
    permissions:
      contents: read
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-python-tests.result != 'skipped'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pytest-results_*
          merge-multiple: true

      - name: Check if coverage files exist
        id: check-coverage
        run: |
          if compgen -G "./docker/coverage_*.xml" > /dev/null || compgen -G "./coverage_*.xml" > /dev/null; then
            echo "has_coverage=true" >> $GITHUB_OUTPUT
          else
            echo "has_coverage=false" >> $GITHUB_OUTPUT
          fi

      - name: Normalize coverage paths
        if: steps.check-coverage.outputs.has_coverage == 'true'
        run: |
          python3 python_tests/normalize_coverage_paths.py ./docker/coverage_*.xml ./coverage_*.xml

      - name: Upload coverage to CodeCov
        if: steps.check-coverage.outputs.has_coverage == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./docker/coverage_*.xml,./coverage_*.xml
          flags: python-docker
          fail_ci_if_error: false
          verbose: true

      - name: Check if test results exist
        id: check-results
        run: |
          if compgen -G "./docker/test-results_*.xml" > /dev/null || compgen -G "./test-results_*.xml" > /dev/null; then
            echo "has_results=true" >> $GITHUB_OUTPUT
          else
            echo "has_results=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload test results to Codecov
        if: steps.check-results.outputs.has_results == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./docker/test-results_*.xml,./test-results_*.xml
          flags: python-docker
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  comment-pytest-coverage-report:
    runs-on: ubuntu-latest
    needs: [check-changes, test-python-tests]
    permissions:
      contents: write # This is needed to create/update commit comments
      pull-requests: write # This is needed to create/update comments
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-python-tests.result != 'skipped'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pytest-results_*
          merge-multiple: true

      - name: Prepare test output files
        run: |
          if [ -d "docker" ]; then
            cp -n docker/* . 2>/dev/null || true
          fi
          ls -Rlah

      - name: Check if test outputs exist
        id: check-outputs
        run: |
          if compgen -G "test-outputs_*.txt" > /dev/null || compgen -G "./docker/test-outputs_*.txt" > /dev/null; then
            echo "has_outputs=true" >> $GITHUB_OUTPUT
          else
            echo "has_outputs=false" >> $GITHUB_OUTPUT
          fi

      - name: Pytest coverage comment (Dockerized Tests)
        id: pytest-coverage
        if: steps.check-outputs.outputs.has_outputs == 'true'
        uses: MishaKav/pytest-coverage-comment@9ee59af31bd7bcada1cc496f086b407122602dbd # v1.12.3
        continue-on-error: true
        with:
          pytest-coverage-path: ""
          title: Pytest Coverage Report - Dockerized Tests
          unique-id-for-comment: dockerized-python-tests
          hide-badge: true
          hide-report: true
          create-new-comment: false
          hide-comment: true
          report-only-changed-files: false
          multiple-files: |
            almalinux10_netsnmp_5.10_py310_session_basic, test-outputs_almalinux10_netsnmp_5.10_test_container_py310_session_basic.txt, test-results_almalinux10_netsnmp_5.10_test_container_py310_session_basic.xml
            almalinux10_netsnmp_5.10_py310_session_walk, test-outputs_almalinux10_netsnmp_5.10_test_container_py310_session_walk.txt, test-results_almalinux10_netsnmp_5.10_test_container_py310_session_walk.xml
            almalinux10_netsnmp_5.10_py310_snmp_ops, test-outputs_almalinux10_netsnmp_5.10_test_container_py310_snmp_ops.txt, test-results_almalinux10_netsnmp_5.10_test_container_py310_snmp_ops.xml
            almalinux10_netsnmp_5.10_py310_core_misc, test-outputs_almalinux10_netsnmp_5.10_test_container_py310_core_misc.txt, test-results_almalinux10_netsnmp_5.10_test_container_py310_core_misc.xml
            almalinux10_netsnmp_5.10_py311_session_basic, test-outputs_almalinux10_netsnmp_5.10_test_container_py311_session_basic.txt, test-results_almalinux10_netsnmp_5.10_test_container_py311_session_basic.xml
            almalinux10_netsnmp_5.10_py311_session_walk, test-outputs_almalinux10_netsnmp_5.10_test_container_py311_session_walk.txt, test-results_almalinux10_netsnmp_5.10_test_container_py311_session_walk.xml
            almalinux10_netsnmp_5.10_py311_snmp_ops, test-outputs_almalinux10_netsnmp_5.10_test_container_py311_snmp_ops.txt, test-results_almalinux10_netsnmp_5.10_test_container_py311_snmp_ops.xml
            almalinux10_netsnmp_5.10_py311_core_misc, test-outputs_almalinux10_netsnmp_5.10_test_container_py311_core_misc.txt, test-results_almalinux10_netsnmp_5.10_test_container_py311_core_misc.xml
            almalinux10_netsnmp_5.10_py312_session_basic, test-outputs_almalinux10_netsnmp_5.10_test_container_py312_session_basic.txt, test-results_almalinux10_netsnmp_5.10_test_container_py312_session_basic.xml
            almalinux10_netsnmp_5.10_py312_session_walk, test-outputs_almalinux10_netsnmp_5.10_test_container_py312_session_walk.txt, test-results_almalinux10_netsnmp_5.10_test_container_py312_session_walk.xml
            almalinux10_netsnmp_5.10_py312_snmp_ops, test-outputs_almalinux10_netsnmp_5.10_test_container_py312_snmp_ops.txt, test-results_almalinux10_netsnmp_5.10_test_container_py312_snmp_ops.xml
            almalinux10_netsnmp_5.10_py312_core_misc, test-outputs_almalinux10_netsnmp_5.10_test_container_py312_core_misc.txt, test-results_almalinux10_netsnmp_5.10_test_container_py312_core_misc.xml
            almalinux10_netsnmp_5.10_py313_session_basic, test-outputs_almalinux10_netsnmp_5.10_test_container_py313_session_basic.txt, test-results_almalinux10_netsnmp_5.10_test_container_py313_session_basic.xml
            almalinux10_netsnmp_5.10_py313_session_walk, test-outputs_almalinux10_netsnmp_5.10_test_container_py313_session_walk.txt, test-results_almalinux10_netsnmp_5.10_test_container_py313_session_walk.xml
            almalinux10_netsnmp_5.10_py313_snmp_ops, test-outputs_almalinux10_netsnmp_5.10_test_container_py313_snmp_ops.txt, test-results_almalinux10_netsnmp_5.10_test_container_py313_snmp_ops.xml
            almalinux10_netsnmp_5.10_py313_core_misc, test-outputs_almalinux10_netsnmp_5.10_test_container_py313_core_misc.txt, test-results_almalinux10_netsnmp_5.10_test_container_py313_core_misc.xml
            almalinux10_netsnmp_5.10_py314_session_basic, test-outputs_almalinux10_netsnmp_5.10_test_container_py314_session_basic.txt, test-results_almalinux10_netsnmp_5.10_test_container_py314_session_basic.xml
            almalinux10_netsnmp_5.10_py314_session_walk, test-outputs_almalinux10_netsnmp_5.10_test_container_py314_session_walk.txt, test-results_almalinux10_netsnmp_5.10_test_container_py314_session_walk.xml
            almalinux10_netsnmp_5.10_py314_snmp_ops, test-outputs_almalinux10_netsnmp_5.10_test_container_py314_snmp_ops.txt, test-results_almalinux10_netsnmp_5.10_test_container_py314_snmp_ops.xml
