name: "Sphinx Docs Build"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]

  pull_request:

  release:
    types: [ published ]

  workflow_dispatch:

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  sphinx_docs_build:
    needs: verify-syntax
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.14 env for sphinx...
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles('sphinx_docs_build/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
            ${{ runner.os }}-pip-

      - name: Install Build Requirements
        run: |
          sudo apt update
          sudo apt install -y g++ python3-dev doxygen
          sudo bash ./tools/prepare_linux_netsnmp.sh

      - name: Install Pip Requirements
        run: |
          cd ${{ github.workspace }}/sphinx_docs_build
          # Try to install requirements, if it fails then purge cache and retry
          if ! pip install -r requirements.txt; then
            echo "Installation failed, purging pip cache and retrying..."
            pip install --upgrade pip || true
            pip cache purge || true
            pip install -r requirements.txt
          fi
          pip install -r ${{ github.workspace }}/sphinx_docs_build/landing/requirements.txt

      - name: Run sphinx (latest)
        run: |
          cd ${{ github.workspace }}
          rm -drf build ezsnmp.egg-info
          python3 -m pip install . --verbose
          mkdir -p doxygen_docs_build
          doxygen .doxygen
          cd ${{ github.workspace }}/sphinx_docs_build
          mkdir -p source/_static
          mkdir -p source/_templates
          make clean && make html SPHINXOPTS="-W"

      - name: Build landing page
        run: |
          cd ${{ github.workspace }}/sphinx_docs_build/landing
          mkdir -p source/_static
          mkdir -p source/_templates
          make html SPHINXOPTS="-W"

      - name: Upload artifact for GitHub Pages
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/

  deploy_pages:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    needs: sphinx_docs_build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ── Build versioned docs on release and commit back to main ───────────────
  sphinx_docs_build_release:
    needs: verify-syntax
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository code at release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Python 3.14 env for sphinx...
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sphinx-${{ hashFiles('sphinx_docs_build/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sphinx-
            ${{ runner.os }}-pip-

      - name: Install Build Requirements
        run: |
          sudo apt update
          sudo apt install -y g++ python3-dev doxygen
          sudo bash ./tools/prepare_linux_netsnmp.sh

      - name: Install Pip Requirements
        run: |
          cd ${{ github.workspace }}/sphinx_docs_build
          if ! pip install -r requirements.txt; then
            echo "Installation failed, purging pip cache and retrying..."
            pip install --upgrade pip || true
            pip cache purge || true
            pip install -r requirements.txt
          fi
          pip install -r ${{ github.workspace }}/sphinx_docs_build/landing/requirements.txt

      - name: Build versioned docs
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CLEAN_VER=$(echo "${TAG}" | sed -E 's/^[vV]//')
          VERSION="v${CLEAN_VER}"
          cd ${{ github.workspace }}
          rm -drf build ezsnmp.egg-info
          python3 -m pip install . --verbose
          mkdir -p doxygen_docs_build
          doxygen .doxygen
          cd ${{ github.workspace }}/sphinx_docs_build
          mkdir -p source/_static source/_templates
          sphinx-build -b html -W source/ "/tmp/html_${VERSION}/"

      - name: Switch to main branch
        run: |
          git fetch origin main
          git checkout main
          git pull origin main

      - name: Copy versioned docs into docs/
        run: |
          TAG="${{ github.event.release.tag_name }}"
          CLEAN_VER=$(echo "${TAG}" | sed -E 's/^[vV]//')
          VERSION="v${CLEAN_VER}"
          rm -rf "${{ github.workspace }}/docs/html_${VERSION}/"
          cp -r "/tmp/html_${VERSION}/" "${{ github.workspace }}/docs/html_${VERSION}/"

      - name: Update landing page version list
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys, shutil
          from packaging.version import Version

          docs_dir = pathlib.Path("${{ github.workspace }}/docs")
          index_rst = pathlib.Path("${{ github.workspace }}/sphinx_docs_build/landing/source/index.rst")

          # Normalize any legacy html_V* directory to html_v*
          for d in list(docs_dir.iterdir()):
              if d.is_dir() and d.name.startswith("html_V"):
                  target = docs_dir / ("html_v" + d.name[6:])
                  if not target.exists():
                      d.rename(target)
                  else:
                      shutil.rmtree(d)

          # Helper to parse version from directory name
          def parse_version(dir_name):
              clean = re.sub(r"^html_[vV]", "", dir_name)
              try:
                  return Version(clean)
              except Exception:
                  return Version("0.0.0")

          # Collect all existing versioned directories
          version_dirs = [
              d for d in docs_dir.iterdir()
              if d.is_dir() and d.name.lower().startswith("html_v")
          ]

          # Identify all published stable versions (not prereleases)
          stable_base_versions = {
              parse_version(d.name).base_version
              for d in version_dirs
              if not parse_version(d.name).is_prerelease and parse_version(d.name) != Version("0.0.0")
          }

          # Retire and prune prereleases if their stable release exists
          active_dirs = []
          for d in version_dirs:
              v = parse_version(d.name)
              if v.is_prerelease and v.base_version in stable_base_versions:
                  print(f"Retiring prerelease docs {d.name} in favor of stable {v.base_version}")
                  shutil.rmtree(d)
              else:
                  active_dirs.append(d)

          # Sort remaining versions newest first
          active_dirs.sort(key=lambda d: parse_version(d.name), reverse=True)

          # Build RST list entries (always include Latest Alpha/Beta first)
          rst_items = ["* `Latest Alpha/Beta Version <./html/index.html>`_"]
          for d in active_dirs:
              ver_str = "v" + re.sub(r"^html_[vV]", "", d.name)
              rst_items.append(f"* `{ver_str} <./{d.name}/index.html>`_")
          versions_rst = "\n".join(rst_items)

          content = index_rst.read_text(encoding="utf-8")
          new_content, sub_count = re.subn(
              r'\.\. VERSION_LIST_START\n.*?\.\. VERSION_LIST_END',
              f'.. VERSION_LIST_START\n\n{versions_rst}\n\n.. VERSION_LIST_END',
              content,
              flags=re.DOTALL,
          )

          if sub_count == 0:
              print("ERROR: VERSION_LIST_START/VERSION_LIST_END sentinels not found in index.rst", file=sys.stderr)
              sys.exit(1)

          index_rst.write_text(new_content, encoding="utf-8")
          print("Updated landing/source/index.rst with versions:", [d.name for d in active_dirs])
          EOF

      - name: Build landing page with updated version list
        run: |
          cd ${{ github.workspace }}/sphinx_docs_build/landing
          mkdir -p source/_static
          mkdir -p source/_templates
          make clean && make html SPHINXOPTS="-W"

      - name: Create Pull Request with versioned docs
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: add versioned documentation for ${{ github.event.release.tag_name }}"
          title: "📚 Add versioned docs for ${{ github.event.release.tag_name }}"
          body: |
            This PR adds the versioned Sphinx documentation for release `${{ github.event.release.tag_name }}`.
            - Built from release tag: `${{ github.event.release.tag_name }}`
            - Run ID: ${{ github.run_id }}
            - Auto-merge enabled
          branch: docs/add-versioned-docs-${{ github.event.release.tag_name }}
          base: main
          delete-branch: true
          labels: documentation, automated-pr
          add-paths: |
            docs/
            sphinx_docs_build/landing/source/index.rst

      - name: Enable Auto-merge
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          PR_NUMBER="${{ steps.create-pr.outputs.pull-request-number }}"
          echo "Attempting to auto-merge PR #$PR_NUMBER"
          gh pr merge --auto --merge "$PR_NUMBER"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
