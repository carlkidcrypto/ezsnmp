---
name: Validate Workflow Files

concurrency:
  group: verify_syntax-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/agentics-maintenance.yml'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/*.yml'
      - '!.github/workflows/*.lock.yml'
      - '!.github/workflows/agentics-maintenance.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_verify_syntax.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      run-shellcheck: false
