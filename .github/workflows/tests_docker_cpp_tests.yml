name: Run Dockerized Cpp Tests

concurrency:
  group: tests_docker_cpp_tests
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

# Added explicit permissions so the publish-unit-test-result action can create check runs
permissions:
  contents: write
  checks: write

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in source code
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/tests_docker_cpp_tests.yml
            cpp_tests/**
            docker/**
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h

  test-cpp-tests:
    needs: check-changes
    if: needs.check-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        distro:
          - almalinux10_netsnmp_5.9
          - archlinux_netsnmp_5.7
          - archlinux_netsnmp_5.8
          - archlinux_netsnmp_5.9
          - centos7_netsnmp_5.7
          - centos8_netsnmp_5.8
          - fedora42_netsnmp_5.7
          - fedora42_netsnmp_5.8
          - fedora42_netsnmp_5.9
          - rockylinux8_netsnmp_5.8
          - rockylinux9_netsnmp_5.9
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Cache Docker C++ build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cpp_tests/build
          key: cpp-docker-build-${{ matrix.distro }}-${{ hashFiles('ezsnmp/**/*.cpp', 'ezsnmp/**/*.h', 'cpp_tests/**', 'docker/**') }}

      - name: Run unit tests inside the Docker container (${{ matrix.distro }})
        run: |
           cd docker/
           chmod +x run_cpp_tests_in_all_dockers.sh
           ./run_cpp_tests_in_all_dockers.sh ${{ matrix.distro }}

      - name: Fix permissions for build cache
        if: always()
        run: sudo chown -R $USER:$USER cpp_tests/build 2>/dev/null || true

      - name: Upload Test Results (${{ matrix.distro }})
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v5
        with:
          name: cpp-test-results-dockerized-${{ matrix.distro }}
          path: |
            docker/test_outputs_${{ matrix.distro }}/test-results.xml
            docker/test_outputs_${{ matrix.distro }}/test-outputs.txt
            docker/test_outputs_${{ matrix.distro }}/lcov_coverage.info

  upload-cpp-coverage-dockerized:
    runs-on: ubuntu-latest
    needs: [check-changes, test-cpp-tests]
    permissions:
      contents: read
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-cpp-tests.result != 'skipped'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download coverage artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cpp-test-results-dockerized-*
          path: artifacts/

      - name: Upload coverage to CodeCov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./artifacts/**/lcov_coverage.info
          flags: cpp,docker
          fail_ci_if_error: false
          verbose: true

      - name: Upload test results to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./artifacts/**/test-results.xml
          flags: cpp,docker
          report_type: test_results
          fail_ci_if_error: false
          verbose: true

  comment-cpp-test-report:
    runs-on: ubuntu-latest
    needs: [check-changes, test-cpp-tests]
    permissions:
      pull-requests: write # Needed to create/update PR comments
      contents: write      # Needed to read artifacts/content for check run
      checks: write        # Needed to create/update check runs
    if: always() && needs.check-changes.outputs.any_changed == 'true' && needs.test-cpp-tests.result != 'skipped'
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cpp-test-results-dockerized-*
          path: artifacts/

      - name: List files
        run: ls -Rlah artifacts/

      - name: Publish C++ Test Results (Dockerized Tests)
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: needs.check-changes.outputs.any_changed == 'true'
        with:
          files: "artifacts/**/test-results.xml"
          check_name: C++ Test Results - Dockerized
          comment_title: C++ Test Results - Dockerized
