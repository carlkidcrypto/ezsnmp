---
name: Update Changelog

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional release tag to highlight in the changelog PR"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-changelog
  cancel-in-progress: false

jobs:
  update-changelog:
    permissions:
      contents: write
      pull-requests: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_auto_changelog.yml@902d603b15a22f5b7ce4ff08b28757cb8ff468b3
    with:
      tag: ${{ inputs.tag || '' }}
