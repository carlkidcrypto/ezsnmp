name: Valgrind PR History Report

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "How many days of PR history to analyze"
        required: false
        default: "0"
      max_prs:
        description: "Max number of recently updated PRs to scan"
        required: false
        default: "1000"
  schedule:
    - cron: "30 6 */3 * *"

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  analyze-valgrind-history:
    needs: verify-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Analyze Valgrind PR comment history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '0' }}
          MAX_PRS: ${{ github.event.inputs.max_prs || '1000' }}
        run: |
          set -o pipefail
          python .github/scripts/analyze_valgrind_pr_history.py | tee valgrind-pr-history-console.log
          exit_code=${PIPESTATUS[0]}
          # Exit code 1 means leak records were found (valid report result, not a workflow failure).
          # Exit code 2 means a configuration or credential error — treat as a real failure.
          if [[ $exit_code -eq 1 ]]; then
            echo "::notice::Valgrind history analysis completed: leak signatures were found (see report)."
            exit 0
          fi
          exit $exit_code

      - name: Publish workflow summary
        run: cat valgrind-pr-history-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: valgrind-pr-history-report
          path: |
            valgrind-pr-history-report.md
            valgrind-pr-history-report.json
            valgrind-pr-history-console.log
