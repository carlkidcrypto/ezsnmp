---
name: Black

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/black.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - '*.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/black.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-syntax:
    permissions:
      contents: read
    uses: ./.github/workflows/verify_syntax.yml
  black:
    needs: verify-syntax
    permissions:
      contents: write
      pull-requests: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_python_black.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
    with:
      auto-fix-pr: true
