name: Integration Tests
permissions:
  pull-requests: write
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

  pull_request:
    branches: [ main ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in source code
        id: changed-files
        uses: carlkidcrypto/shared-workflows/actions/check-source-changes@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
        with:
          files: |
            .github/workflows/integration_tests.yml
            ezsnmp/**/*.cpp
            ezsnmp/**/*.h
            Formula/ezsnmp.rb
            integration_tests/**
            python_tests/*.conf
            python_tests/*.py
            setup.cfg
            setup.py
            tools/prepare_linux_netsnmp.sh
            tools/prepare_macos_netsnmp.sh
            tools/prepare_netsnmp_source.py

  build-and-integration-test:
    runs-on: ${{ matrix.os }}
    needs: check-source-changes
    timeout-minutes: 15
    if: needs.check-source-changes.outputs.run_job == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        exclude:
          # The Homebrew formula selects Homebrew's Python, so the matrix
          # version does not affect macOS integration test execution.
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.15"

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # master
        if: runner.os == 'macOS'

      - name: Enable Homebrew analytics
        run: brew analytics on
        if: runner.os == 'macOS'

      - name: Set up dependencies
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: sudo apt-get install -y --no-install-recommends snmpd snmp-mibs-downloader;
                 sudo systemctl stop snmpd;
                 mkdir -p -m 0755 ~/.snmp;
                 echo 'mibs +ALL' > ~/.snmp/snmp.conf;

          macos: HOMEBREW_NO_AUTO_UPDATE=1 brew install net-snmp openssl@3;
                 echo "export PATH=\"$(brew --prefix net-snmp)/bin:\$PATH\"" >> ~/.zshrc;
                 export PATH="$(brew --prefix net-snmp)/bin:$PATH";
                 echo "export PATH=\"$(brew --prefix net-snmp)/sbin:\$PATH\"" >> ~/.zshrc;
                 export PATH="$(brew --prefix net-snmp)/sbin:$PATH";
                 mkdir -p -m 0755 ~/.snmp;
                 echo 'mibs +ALL' > ~/.snmp/snmp.conf;

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Cache Net-SNMP 5.10 build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /tmp/netsnmp-5.10-brew-prefix
            /tmp/netsnmp-5.10-linux
          key: netsnmp-5.10-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Formula/ezsnmp.rb', 'setup.cfg', 'tools/prepare_linux_netsnmp.sh', 'tools/prepare_macos_netsnmp.sh', 'tools/prepare_netsnmp_source.py') }}

      - name: Cache ezsnmp compiled object files
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/ezsnmp-object-cache
          key: ezsnmp-objcache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ezsnmp/**/*.cpp', 'ezsnmp/**/*.h', 'ezsnmp/interface/*.i', 'setup.py', 'build_utils.py', 'Formula/ezsnmp.rb') }}
          restore-keys: |
            ezsnmp-objcache-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore cached Net-SNMP 5.10 on Linux
        if: runner.os == 'Linux'
        run: |
          if [ -x /tmp/netsnmp-5.10-linux/bin/net-snmp-config ] && [ -f /tmp/netsnmp-5.10-linux/lib/pkgconfig/netsnmp.pc ]; then
            echo "Restoring cached Net-SNMP 5.10 to /usr/local..."
            sudo cp -a /tmp/netsnmp-5.10-linux/. /usr/local/
            sudo ldconfig /usr/local/lib || true
          fi

      - name: Install Net-SNMP 5.10
        if: runner.os == 'Linux'
        uses: carlkidcrypto/shared-workflows/actions/prepare-netsnmp@eeefdd5c0a594d59ae86a09437b2de9bb57618a3

      - name: Save Net-SNMP 5.10 to Linux cache directory
        if: runner.os == 'Linux'
        run: |
          if [ ! -x /tmp/netsnmp-5.10-linux/bin/net-snmp-config ] && [ -x /usr/local/bin/net-snmp-config ]; then
            mkdir -p /tmp/netsnmp-5.10-linux/bin /tmp/netsnmp-5.10-linux/include /tmp/netsnmp-5.10-linux/lib/pkgconfig /tmp/netsnmp-5.10-linux/share
            cp -a /usr/local/bin/net-snmp-config /tmp/netsnmp-5.10-linux/bin/
            cp -a /usr/local/include/net-snmp /tmp/netsnmp-5.10-linux/include/
            cp -a /usr/local/lib/libnetsnmp* /tmp/netsnmp-5.10-linux/lib/
            cp -a /usr/local/lib/pkgconfig/netsnmp.pc /tmp/netsnmp-5.10-linux/lib/pkgconfig/
            if [ -d /usr/local/share/snmp ]; then
              cp -a /usr/local/share/snmp /tmp/netsnmp-5.10-linux/share/
            fi
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          allow-prereleases: true
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install pip dependencies
        run: |
          # Integration tests don't need cibuildwheel, skip requirements.txt
          echo "Integration tests don't require additional pip dependencies"

      - name: Build source
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            export EZSNMP_NETSNMP_CONFIG=/usr/local/bin/net-snmp-config
            export EZSNMP_OBJECT_CACHE_DIR=/tmp/ezsnmp-object-cache
            export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
            python3 -m pip install . --verbose;
            rm -drf build/ ezsnmp.egg-info/;
          elif [ "$RUNNER_OS" == "macOS" ]; then
            PKG_VERSION=$(python3 -c "import re, sys; match = re.search(r'^version\s*=\s*(.+)$', open('setup.cfg').read(), re.MULTILINE); print(match.group(1).strip() if match else sys.exit('ERROR: could not find version field in setup.cfg'))")
            # Package the current checkout with a versioned filename so Homebrew
            # can infer the formula version without a temporary version stanza.
            SOURCE_TARBALL="/tmp/ezsnmp-${PKG_VERSION}.tar.gz"
            git archive HEAD --format=tar.gz -o "${SOURCE_TARBALL}"
            TARBALL_SHA=$(shasum -a 256 "${SOURCE_TARBALL}" | awk '{print $1}')
            # Homebrew 7.0.14+ forbids loading formulae from arbitrary file paths even
            # with HOMEBREW_DEVELOPER=1, so stage the rewritten formula in a local tap.
            HOMEBREW_NO_AUTO_UPDATE=1 brew untap local/ezsnmp 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew tap-new --no-git local/ezsnmp
            TAP_FORMULA="$(brew --repository)/Library/Taps/local/homebrew-ezsnmp/Formula/ezsnmp.rb"
            mkdir -p "$(dirname "${TAP_FORMULA}")"
            cp -L Formula/ezsnmp.rb "${TAP_FORMULA}"
            sed -i '' "s|^  url \".*\"|  url \"file://${SOURCE_TARBALL}\"|" "${TAP_FORMULA}"
            sed -i '' "s|^  sha256 \".*\"|  sha256 \"${TARBALL_SHA}\"|" "${TAP_FORMULA}"
            TAP_FORMULA="${TAP_FORMULA}" python3 - <<'PYEOF'
          import os
          import re
          from pathlib import Path

          formula_path = Path(os.environ["TAP_FORMULA"])
          content = formula_path.read_text(encoding="utf-8")

          def wrap_stage(match: re.Match) -> str:
              indented = "\n".join(
                  "  " + line if line.strip() else line
                  for line in match.group(1).splitlines()
              )
              return (
                  '    netsnmp_cache = "/tmp/netsnmp-5.10-brew-prefix"\n'
                  '    if File.executable?("#{netsnmp_cache}/bin/net-snmp-config")\n'
                  '      ohai "Restoring cached Net-SNMP 5.10 into #{prefix}"\n'
                  '      mkdir_p prefix\n'
                  '      cp_r Dir["#{netsnmp_cache}/*"], "#{prefix}/"\n'
                  '    else\n'
                  f'{indented}\n'
                  '      rm_rf netsnmp_cache\n'
                  '      mkdir_p netsnmp_cache\n'
                  '      cp_r Dir["#{prefix}/*"], "#{netsnmp_cache}/"\n'
                  '    end'
              )

          content, count = re.subn(
              r'(    resource\("net-snmp"\)\.stage do\n.*?\n    end)',
              wrap_stage,
              content,
              count=1,
              flags=re.DOTALL,
          )
          assert count == 1, "Failed to wrap net-snmp stage block in TAP_FORMULA"
          if os.path.isfile("/tmp/netsnmp-5.10-brew-prefix/bin/net-snmp-config"):
              content = re.sub(
                  r'\n  on_arm do\n.*?\n  end\n',
                  '\n',
                  content,
                  count=1,
                  flags=re.DOTALL,
              )
          target_env = '    ENV["EZSNMP_NETSNMP_CONFIG"] = "#{prefix}/bin/net-snmp-config"'
          assert target_env in content, "Failed to locate EZSNMP_NETSNMP_CONFIG in TAP_FORMULA"
          content = content.replace(
              target_env,
              target_env + '\n    ENV["EZSNMP_OBJECT_CACHE_DIR"] = "/tmp/ezsnmp-object-cache"',
              1,
          )
          formula_path.write_text(content, encoding="utf-8")
          PYEOF
            HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --force ezsnmp 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --force carlkidcrypto/ezsnmp/ezsnmp 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew uninstall --force local/ezsnmp/ezsnmp 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew install --formula --build-from-source local/ezsnmp/ezsnmp
          fi

      - name: Start SNMP daemon
        run: |
          if [ "$RUNNER_OS" == "Linux" ]
          then
            mibdir="-M +/var/lib/snmp/mibs"
            SNMPD=$(which snmpd)
          elif [ "$RUNNER_OS" == "macOS" ]
          then
            NETSNMP_PREFIX="$(brew --prefix net-snmp)"
            export PATH="${NETSNMP_PREFIX}/bin:${NETSNMP_PREFIX}/sbin:$PATH"
            export SNMP_PERSISTENT_DIR="${RUNNER_TEMP:-$HOME}/snmp-persistent"
            mkdir -p "$SNMP_PERSISTENT_DIR"
            if [ -d "/opt/homebrew/share/snmp/mibs" ]; then
              mibdir="-M +/opt/homebrew/share/snmp/mibs"
            elif [ -d "/usr/local/share/snmp/mibs" ]; then
              mibdir="-M +/usr/local/share/snmp/mibs"
            else
              mibdir=""
            fi
            SNMPD=$(which snmpd)
          else
            mibdir=""
            SNMPD=$(which.exe snmpd)
          fi
          $SNMPD -C -c configs/snmpd.conf -r -Le $mibdir -m ALL
          for attempt in {1..15}; do
            if snmpget -v2c -c public -t 1 -r 0 udp:127.0.0.1:11161 .1.3.6.1.2.1.1.1.0 >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 15 ]; then
              echo "SNMP daemon did not become ready on 127.0.0.1:11161" >&2
              exit 1
            fi
            sleep 1
          done

      - name: Run Integration Tests (single)
        uses: carlkidcrypto/os-specific-runner@8bf8551e08c48d9b72f768392e692fad5bb169e7 # v2.5.0
        with:
          linux: |
            export LD_LIBRARY_PATH=/usr/local/lib:${LD_LIBRARY_PATH:-}
            export EZSNMP_FD_TEST_CALLS=10
            cd /home/runner/work/ezsnmp/ezsnmp/integration_tests;
            LOG_FILE="integration_tests_full_${{matrix.os}}_${{matrix.python-version}}.log"
            ./run_integration_tests.sh 2>&1 | tee "$LOG_FILE";
            # Extract key metrics into per-file logs
            grep "Total execution time:" "$LOG_FILE" > "total_execution_time_${{matrix.os}}_${{matrix.python-version}}.log" || true
            grep "usm_unknown_security_name_counter:" "$LOG_FILE" > "usm_unknown_security_name_counter_${{matrix.os}}_${{matrix.python-version}}.log" || true
            grep "connection_error_counter:" "$LOG_FILE" > "connection_error_counter_${{matrix.os}}_${{matrix.python-version}}.log" || true
            # Try to copy the per-test file descriptor log from the output directory saved by the script
            OUT_DIR=$(grep -m1 "Results saved to:" "$LOG_FILE" | sed 's/Results saved to: //') || true
            if [ -n "$OUT_DIR" ] && [ -f "$OUT_DIR/test_file_descriptors.log" ]; then
              cp "$OUT_DIR/test_file_descriptors.log" "test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" || true
            else
              # Fallback: grep relevant lines
              grep -A2 "Running file descriptor tests" "$LOG_FILE" > "test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" || true
            fi
            echo "artifactPath1=/home/runner/work/ezsnmp/ezsnmp/integration_tests/total_execution_time_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath2=/home/runner/work/ezsnmp/ezsnmp/integration_tests/usm_unknown_security_name_counter_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath3=/home/runner/work/ezsnmp/ezsnmp/integration_tests/connection_error_counter_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath4=/home/runner/work/ezsnmp/ezsnmp/integration_tests/test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath5=/home/runner/work/ezsnmp/ezsnmp/integration_tests/integration_tests_full_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;

          macos: |
            # Resolve the Python that brew installed ezsnmp for and put it first in PATH
            # so that `python3` calls inside run_integration_tests.sh use that interpreter
            BREW_EZSNMP=$(brew --prefix ezsnmp)
            PYTHON_VER=$(ls "${BREW_EZSNMP}/lib/" | grep -E '^python[0-9]+\.[0-9]+$' | sort -V | tail -1 | sed 's/python//')
            export PATH="$(brew --prefix python@${PYTHON_VER})/bin:${PATH}"
            export EZSNMP_FD_TEST_CALLS=10
            cd /Users/runner/work/ezsnmp/ezsnmp/integration_tests;
            LOG_FILE="integration_tests_full_${{matrix.os}}_${{matrix.python-version}}.log"
            ./run_integration_tests.sh 2>&1 | tee "$LOG_FILE";
            # Extract key metrics into per-file logs
            grep "Total execution time:" "$LOG_FILE" > "total_execution_time_${{matrix.os}}_${{matrix.python-version}}.log" || true
            grep "usm_unknown_security_name_counter:" "$LOG_FILE" > "usm_unknown_security_name_counter_${{matrix.os}}_${{matrix.python-version}}.log" || true
            grep "connection_error_counter:" "$LOG_FILE" > "connection_error_counter_${{matrix.os}}_${{matrix.python-version}}.log" || true
            # Try to copy the per-test file descriptor log from the output directory saved by the script
            OUT_DIR=$(grep -m1 "Results saved to:" "$LOG_FILE" | sed 's/Results saved to: //') || true
            if [ -n "$OUT_DIR" ] && [ -f "$OUT_DIR/test_file_descriptors.log" ]; then
              cp "$OUT_DIR/test_file_descriptors.log" "test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" || true
            else
              # Fallback: grep relevant lines
              grep -A2 "Running file descriptor tests" "$LOG_FILE" > "test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" || true
            fi
            echo "artifactPath1=/Users/runner/work/ezsnmp/ezsnmp/integration_tests/total_execution_time_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath2=/Users/runner/work/ezsnmp/ezsnmp/integration_tests/usm_unknown_security_name_counter_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath3=/Users/runner/work/ezsnmp/ezsnmp/integration_tests/connection_error_counter_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath4=/Users/runner/work/ezsnmp/ezsnmp/integration_tests/test_file_descriptors_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;
            echo "artifactPath5=/Users/runner/work/ezsnmp/ezsnmp/integration_tests/integration_tests_full_${{matrix.os}}_${{matrix.python-version}}.log" >> $GITHUB_ENV;

      - name: Upload Integration Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v5
        with:
          name: integration-test-results_${{matrix.os}}_${{matrix.python-version}}
          path: |
            ${{ env.artifactPath1 }}
            ${{ env.artifactPath2 }}
            ${{ env.artifactPath3 }}
            ${{ env.artifactPath4 }}
            ${{ env.artifactPath5 }}

  pr-summary:
    needs: build-and-integration-test
    if: github.event_name == 'pull_request' && needs.build-and-integration-test.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts

      - name: Prepare PR integration-test summary
        run: |
          python3 -c "
          import os
          import re
          import statistics

          data = {}
          for root, dirs, files in os.walk('artifacts'):
              for file in files:
                  if file.startswith('integration_tests_full_') and file.endswith('.log'):
                      with open(os.path.join(root, file), errors='replace') as f:
                          for line in f:
                              m = re.search(r'(\w+): - (\d+) - (?:.+): (.+)', line.strip())
                              if m:
                                  test_type, num, value = m.groups()
                                  try:
                                      val = float(value.split()[0])
                                  except ValueError:
                                      continue
                                  data.setdefault((test_type, int(num)), []).append(val)

          summary = '<!-- integration-test-summary -->\n## Integration Test Results \u23f1\ufe0f\n\n'

          if data:
              summary += '<details>\n<summary>\U0001f680 Performance Details (aggregated across all OSes &amp; Python versions)</summary>\n\n'
              categories = {}
              for (test_type, num) in sorted(data):
                  parts = test_type.split('_')
                  try:
                      idx = parts.index('snmp')
                      cat = ' '.join(p.title() for p in parts[:idx])
                      op  = ' '.join(p.title() for p in parts[idx+1:])
                  except ValueError:
                      cat = parts[0].title()
                      op  = ' '.join(p.title() for p in parts[1:])
                  categories.setdefault(cat, []).append((op, num, data[(test_type, num)]))
              for cat in sorted(categories):
                  summary += f'#### {cat} Tests\n\n'
                  summary += '| Operation | Workers | Min (s) | Max (s) | Avg (s) | StdDev \U0001f4ca |\n'
                  summary += '|-----------|---------|---------|---------|---------|----------|\n'
                  for op, num, vals in sorted(categories[cat], key=lambda x: (x[0], x[1])):
                      if len(vals) > 1:
                          summary += f'| {op} | {num} | {min(vals):.3f} | {max(vals):.3f} | {statistics.mean(vals):.3f} | {statistics.stdev(vals):.3f} |\n'
                      else:
                          summary += f'| {op} | {num} | {vals[0]:.3f} | {vals[0]:.3f} | {vals[0]:.3f} | N/A |\n'
                  summary += '\n'
              summary += '</details>\n\n'

          fd_records = []
          for root, dirs, files in os.walk('artifacts'):
              for file in files:
                  if file.startswith('test_file_descriptors_') and file.endswith('.log'):
                      with open(os.path.join(root, file), errors='replace') as f:
                          content = f.read()
                      cur = None
                      for line in content.split('\n'):
                          rm = re.search(r'Running (work_(?:get|op)_(?:no_close|close)):\s*(\S+)(?:\s+(\S+))?', line)
                          if rm:
                              if cur and 'session' in cur:
                                  fd_records.append(cur)
                              mode_raw, op_or_sess, sess_opt = rm.groups()
                              cur = {'session': sess_opt if sess_opt else op_or_sess,
                                     'operation': op_or_sess if sess_opt else 'unknown',
                                     'mode': 'no close' if 'no_close' in mode_raw else 'close'}
                              continue
                          if cur is None:
                              continue
                          m = re.search(r'Subprocess PID:? Open FDs before:\s*(\d+)', line)
                          if m:
                              cur['fd_before'] = int(m.group(1))
                          m = re.search(r'Subprocess PID\s*Open FDs after:\s*(\d+)', line)
                          if m:
                              cur['fd_after'] = int(m.group(1))
                          m = re.search(r'Total execution time:\s*([\d.]+)', line)
                          if m:
                              cur['exec_time'] = float(m.group(1))
                          m = re.search(r'Average time per SNMP call.*?:\s*([\d.]+)', line)
                          if m:
                              cur['avg_time'] = float(m.group(1))
                      if cur and 'session' in cur:
                          fd_records.append(cur)

          if fd_records:
              grouped = {}
              for rec in fd_records:
                  key = (rec['session'], rec.get('operation', 'unknown'), rec['mode'])
                  g = grouped.setdefault(key, {'fd_before': [], 'fd_after': [], 'exec_time': [], 'avg_time': []})
                  for fld in ('fd_before', 'fd_after', 'exec_time', 'avg_time'):
                      if fld in rec:
                          g[fld].append(rec[fld])
              leaks = sum(
                  1 for g in grouped.values()
                  if g['fd_before'] and g['fd_after']
                  and statistics.mean(g['fd_after']) > statistics.mean(g['fd_before'])
              )
              status = f'\u26a0\ufe0f {leaks} potential leak(s) detected' if leaks else '\u2705 No leaks detected'
              summary += f'### \U0001f4c1 File Descriptor Tests: {status}\n\n'
              summary += '<details>\n<summary>\U0001f4cb FD Test Details (click to expand)</summary>\n\n'
              summary += '| Session | Operation | Mode | FD Leak | Exec (s) | Avg/Call (s) |\n'
              summary += '|---------|-----------|------|---------|----------|-------------|\n'
              for (sess, op, mode) in sorted(grouped):
                  g = grouped[(sess, op, mode)]
                  sd = sess.replace('SESS_', '').replace('_ARGS', '')
                  if g['fd_before'] and g['fd_after']:
                      lk = statistics.mean(g['fd_after']) - statistics.mean(g['fd_before'])
                      lk_icon = '\u26a0\ufe0f' if lk > 0 else '\u2705'
                      lk_str = f'{lk_icon} {lk:+.0f}'
                  else:
                      lk_str = 'N/A'
                  exec_list = g['exec_time']
                  avg_list = g['avg_time']
                  et = f'{statistics.mean(exec_list):.3f}' if exec_list else '-'
                  at = f'{statistics.mean(avg_list):.6f}' if avg_list else '-'
                  summary += f'| {sd} | {op} | {mode} | {lk_str} | {et} | {at} |\n'
              summary += '\n</details>\n\n\u2705 File descriptor tests completed successfully\n'
          else:
              summary += '### \U0001f4c1 File Descriptor Tests: \u274c No results found\n'

          with open('integration_test_summary.md', 'w') as f:
              f.write(summary)
          "
          echo "Summary prepared: integration_test_summary.md"

      - name: Find existing integration-test summary comment
        id: find-integration-comment
        uses: peter-evans/find-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- integration-test-summary -->'

      - name: Update PR comment with integration-test summary
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-integration-comment.outputs.comment-id }}
          body-file: integration_test_summary.md
          edit-mode: replace
