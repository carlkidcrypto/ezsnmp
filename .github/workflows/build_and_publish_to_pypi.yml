---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: PyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  pypi-publish:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@22f04e222fa07048891327e4d34bb174d36e7bfa
    with:
      target: 'pypi'
      environment-name: 'build_and_publish_to_pypi'
      use-local-wheel-action: true
      python-version: '3.14'
      sdist-setup-cmd: 'sudo bash ./tools/prepare_linux_netsnmp.sh'
      skip-existing: false
      verify-metadata: false
      skip-publish: true

  publish:
    needs: pypi-publish
    if: needs.pypi-publish.outputs.artifacts-built == 'true'
    name: Publish distribution to PyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to PyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          skip-existing: false
          verify-metadata: false
          print-hash: true
