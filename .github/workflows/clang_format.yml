name: Clang-format

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '.clang-format'
      - '.github/workflows/clang_format.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.c'
      - '.clang-format'
      - '.github/workflows/clang_format.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  clang-format:
    needs: verify-syntax
    permissions:
      contents: write
      pull-requests: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_clang_format.yml@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
    with:
      auto-fix-pr: true
