---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, refactor/common-publish-action]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-pypi-publish:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@f1f9056d69addcc7b59be128e417a9e7338cbdab
    with:
      target: 'testpypi'
      environment-name: 'build_and_publish_to_test_pypi'
      use-local-wheel-action: true
      python-version: '3.14'
      check-changes: true
      changed-files-patterns: |
        .github/workflows/build_and_publish_to_test_pypi.yml
        .github/actions/build-wheels/action.yml
        .github/actions/build-distribution/action.yml
        pyproject.toml
        setup.cfg
        setup.py
        build_utils.py
        requirements.txt
        tools/prepare_netsnmp_source.py
        tools/prepare_linux_netsnmp.sh
        tools/prepare_macos_netsnmp.sh
      third-party-repo: 'net-snmp/net-snmp'
      third-party-ref: 'v5.10.rc1'
      third-party-path: 'third_party/net-snmp'
      sdist-setup-cmd: 'sudo bash ./tools/prepare_linux_netsnmp.sh'
      skip-existing: true
      verify-metadata: false
      skip-publish: true

  publish:
    needs: test-pypi-publish
    if: needs.test-pypi-publish.outputs.artifacts-built == 'true'
    name: Publish distribution to TestPyPI
    runs-on: ubuntu-latest
    environment: build_and_publish_to_test_pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: cibw-wheels-*
          merge-multiple: true
          path: dist/

      - name: Download distribution artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sdist
          path: dist/

      - name: Publish distribution to TestPyPI (OIDC)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1.14
        with:
          packages-dir: dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verify-metadata: false
          print-hash: true
