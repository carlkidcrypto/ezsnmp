---
# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, refactor/common-publish-action]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/workflows/agentics-maintenance.yml'
      - '.github/workflows/shared/**'
      - '.github/scripts/**'
      - '.github/agents/**'
      - '.github/skills/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-pypi-publish:
    permissions:
      contents: read
      id-token: write
    uses: carlkidcrypto/shared-workflows/.github/workflows/reusable_pypi_publish.yml@3538efdfabdbcf0ae956cfc5685fd4c21a59696b
    with:
      target: 'testpypi'
      environment-name: 'build_and_publish_to_test_pypi'
      use-local-wheel-action: true
      python-version: '3.14'
      check-changes: true
      changed-files-patterns: |
        .github/workflows/build_and_publish_to_test_pypi.yml
        .github/actions/build-wheels/action.yml
        .github/actions/build-distribution/action.yml
        pyproject.toml
        setup.cfg
        setup.py
        build_utils.py
        requirements.txt
      sdist-setup-cmd: 'sudo bash ./tools/prepare_linux_netsnmp.sh'
      skip-existing: true
      verify-metadata: false
