# Refer to the following link for help
# https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/

name: TestPyPI Distributions
concurrency:
  group: build_and_publish_to_test_pypi
  cancel-in-progress: true
on:
  push:
    branches: [ main, refactor/common-publish-action ]
    paths-ignore:
      - '.github/workflows/*.md'
      - '.github/workflows/*.lock.yml'
      - '.github/aw/**'
      - '.github/*.md'
      - '**/*.md'
      - '**/*.rst'
      - 'docs/**'
      - 'sphinx_docs_build/**'
  workflow_dispatch:

jobs:
  verify-syntax:
    permissions: { contents: read }
    uses: ./.github/workflows/verify_syntax.yml
  check-source-changes:
    needs: verify-syntax
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: Checkout Sourcecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Check for changes in setup.py/cfg
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            .github/workflows/build_and_publish_to_test_pypi.yml
            .github/actions/prepare-windows-netsnmp/action.yml
            .github/actions/build-wheels/action.yml
            .github/actions/build-and-publish-distribution/action.yml
            pyproject.toml
            setup.cfg
            setup.py
            requirements.txt

  build_wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: check-source-changes
    if: needs.check-source-changes.outputs.run_job == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: macos-latest
            arch: arm64
          - os: windows-latest
            arch: AMD64
          - os: windows-latest
            arch: x86
          - os: windows-latest
            arch: ARM64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Build and upload wheels
        uses: ./.github/actions/build-wheels
        with:
          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}
          job-index: ${{ strategy.job-index }}

  build-n-publish-test-pypi:
    name: Build and Publish To Test PyPi
    runs-on: ubuntu-latest
    environment: build_and_publish_to_test_pypi
    permissions:
      id-token: write
    needs: build_wheels

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Build and publish distribution
        uses: ./.github/actions/build-and-publish-distribution
        with:
          target: test_pypi
