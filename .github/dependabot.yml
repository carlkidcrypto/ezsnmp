updates:
- directory: /
  # Agentic workflow lock files are auto-generated by gh aw compile.
  # Dependabot should not open PRs for those manifests.
  exclude-paths:
    - ".github/workflows/agentics-maintenance.yml"
    - ".github/workflows/*.lock.yml"
    - ".github/workflows/*.md"
    - ".github/agents/*.md"
    - ".github/aw/*.lock.json"
  open-pull-requests-limit: 10
  package-ecosystem: github-actions
  schedule:
    interval: daily
- directory: /
  # The root scan includes setup.cfg, pyproject.toml, setup.py, and nested
  # requirements files such as python_tests/requirements.txt.
  groups:
    python-dependencies:
      patterns:
        - "*"
  open-pull-requests-limit: 10
  package-ecosystem: pip
  schedule:
    interval: daily
version: 2
