name: Build Wheels
description: Build Python wheels across platforms using cibuildwheel and upload artifacts.

inputs:
  os:
    description: Operating system for the wheel build runner
    required: true
  arch:
    description: Target architecture (e.g. x86_64, arm64, AMD64, x86, ARM64)
    required: true
  job-index:
    description: Matrix job index for unique artifact naming
    required: true
  cibw-build:
    description: Optional CIBW_BUILD selector pattern (e.g. *-manylinux*, *-musllinux*)
    required: false
    default: "*"
  label:
    description: Optional matrix label for distinct cache keys (defaults to arch)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Build wheels via shared-workflows
      uses: carlkidcrypto/shared-workflows/actions/build-wheels@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
      with:
        os: ${{ inputs.os }}
        arch: ${{ inputs.arch }}
        job-index: ${{ inputs.job-index }}
        cibw-build: ${{ inputs.cibw-build }}
        label: ${{ inputs.label }}
        python-version: "3.14"
        obj-cache-dir: "ezsnmp-obj-cache"
        obj-cache-hash: ${{ hashFiles('ezsnmp/include/**', 'ezsnmp/src/**/*.cpp', 'setup.py', 'build_utils.py') }}
        prepare-windows-netsnmp: "true"
        net-snmp-version: "5.10.rc1"
        net-snmp-sha256: "a81b239f877910af4959c16e6c71872bd10507404d00650b7cba28df9ce0bb20"
        macos-deployment-target-from-build-utils: "true"
