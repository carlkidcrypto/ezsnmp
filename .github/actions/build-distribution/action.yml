name: Build Distribution
description: Build sdist and download built wheels.

inputs:
  packages-dir:
    description: Directory containing distributions to publish
    required: false
    default: "dist/"

runs:
  using: composite
  steps:
    - name: Build distribution via shared-workflows
      uses: carlkidcrypto/shared-workflows/actions/build-distribution@eeefdd5c0a594d59ae86a09437b2de9bb57618a3
      with:
        packages-dir: ${{ inputs.packages-dir }}
        python-version: "3.14"
        setup-cmd: |
          sudo bash ./tools/prepare_linux_netsnmp.sh
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          echo "EZSNMP_NETSNMP_CONFIG=/usr/local/bin/net-snmp-config" >> "$GITHUB_ENV"
