style: github
template: CHANGELOG.tpl.md
info:
  title: CHANGELOG
  repository_url: https://github.com/carlkidcrypto/ezsnmp
options:
  commits:
  commit_groups:
    title_maps:
      # Lowercase conventional commits
      feat: Features
      fix: Bug Fixes
      perf: Performance Improvements
      refactor: Code Refactoring
      docs: Documentation Updates
      chore: Maintenance
      build: Build System
      ci: Continuous Integration
      test: Tests
      style: Styles
      revert: Reverts
      # Capitalized word prefixes
      Bump: Dependency Updates
      Release: Releases
      Add: Features
      Fix: Bug Fixes
      Update: Updates & Improvements
      Refactor: Code Refactoring
      Document: Documentation Updates
      Enhance: Enhancements
      Hotfix: Critical Bug Fixes
      Initial: Initial Setup
      Increase: Performance Improvements
      Modernize: Code Improvements
      Python: Python-related Changes
      Feature: Features
      Use: Code Refactoring
      # Merge commits
      Merge: Merged Pull Requests
      # Fallback
      other: Other Changes
  header:
    # Pattern matches: conventional commits (feat:, feat(scope):, feat!:, feat(scope)!:),
    # bracketed prefixes ([tag] ...), capitalized prefixes (Bump, Release, Fix, Add),
    # and falls back to "" (routed to other) for emoji or unprefixed commits.
    pattern: "^\\s*((?:\\[[^\\]]+\\]\\s*)?([\\w]*)(?:\\([^)]*\\))?!?.*)$"
    pattern_maps:
      - Subject
      - Type
  notes:
    keywords:
      - BREAKING CHANGE