# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

# Exclude built documentation and Docker test environments from static code analysis (security, reliability, maintainability)
sonar.exclusions=docs/**,docker/**

# Exclude built documentation and Docker test environments from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,docker/**
