# SonarQube Cloud Automatic Analysis Configuration
# https://docs.sonarsource.com/sonarcloud/advanced-setup/analysis-scope/

# Source and Test directories
sonar.sources=.
sonar.tests=python_tests,cpp_tests,integration_tests

# Target Python versions matching pyproject.toml / setup.cfg (>=3.11)
sonar.python.version=3.11, 3.12, 3.13, 3.14

# Exclude built documentation, workflows, third-party code, generated SWIG artifacts, test code, and internal analysis from main sources
sonar.exclusions=docs/**,.github/**,docker/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,analysis/**,ezsnmp/src/net-snmp-5.10-final-patched/**,ezsnmp/patches/**,ezsnmp/*_wrap.cxx,ezsnmp/datatypes.py,ezsnmp/exceptionsbase.py,ezsnmp/netsnmpbase.py,ezsnmp/sessionbase.py,python_tests/**,cpp_tests/**,integration_tests/**

# Exclude built documentation, workflows, third-party code, generated code, tests, sample configs, and internal analysis from copy-paste detection (duplication metrics)
sonar.cpd.exclusions=docs/**,.github/**,docker/**,third_party/**,doxygen_docs_build/**,sphinx_docs_build/**,analysis/**,ezsnmp/src/net-snmp-5.10-final-patched/**,ezsnmp/patches/**,ezsnmp/*_wrap.cxx,ezsnmp/datatypes.py,ezsnmp/exceptionsbase.py,ezsnmp/netsnmpbase.py,ezsnmp/sessionbase.py,python_tests/**,cpp_tests/**,integration_tests/**,configs/**
